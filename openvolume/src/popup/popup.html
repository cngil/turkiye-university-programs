<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>OpenVolume</title>
    <script src="theme-boot.js"></script>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <svg width="0" height="0" class="sprite" aria-hidden="true">
      <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z" /><path class="wave1" d="M15.5 8.5a5 5 0 0 1 0 7" /><path class="wave2" d="M18.5 5.5a9 9 0 0 1 0 13" /></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z" /><path d="m22 9-6 6M16 9l6 6" /></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z" /></symbol>
      <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12h4l2.5-5 4 10 3-7 2 2h4.5" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></symbol>
      <symbol id="i-restore" viewBox="0 0 24 24"><path d="M12 8v4l3 2" /><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5" /></symbol>
      <symbol id="i-bass" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></symbol>
      <symbol id="i-voice" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3" /><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8" /></symbol>
      <symbol id="i-volume-tab" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z" /><path d="M15.5 8.5a5 5 0 0 1 0 7" /></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4M12 8h.01" /></symbol>
      <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3.1-.4 6.4-1.5 6.4-6.9A5.4 5.4 0 0 0 20 4.8 5 5 0 0 0 19.9 1S18.7.7 16 2.5a13.4 13.4 0 0 0-7 0C6.3.7 5.1 1 5.1 1A5 5 0 0 0 5 4.8a5.4 5.4 0 0 0-1.5 3.8c0 5.4 3.3 6.5 6.4 6.9A3.4 3.4 0 0 0 9 18.1V22" /></symbol>
    </svg>

    <header class="topbar">
      <div class="brand">
        <img src="../icons/icon-32.png" alt="" width="22" height="22" />
        <span>OpenVolume</span>
      </div>
      <div class="top-actions">
        <button id="theme-toggle" class="icon-btn" type="button">
          <svg class="to-dark"><use href="#i-moon" /></svg>
          <svg class="to-light"><use href="#i-sun" /></svg>
        </button>
        <button id="open-settings" class="icon-btn" type="button" data-i18n-title="settings">
          <svg><use href="#i-gear" /></svg>
        </button>
      </div>
    </header>

    <main id="main-view">
      <section class="card" id="control-card">
        <div class="tab-head">
          <span class="favicon" id="current-favicon" aria-hidden="true"></span>
          <div class="tab-text">
            <div class="tab-title" id="current-title"></div>
            <div class="tab-host" id="current-host"></div>
          </div>
          <span class="mode-chip" id="mode-chip" hidden></span>
        </div>

        <div class="readout-row">
          <button id="mute" class="mute-btn" type="button" data-i18n-title="mute">
            <svg class="on"><use href="#i-speaker" /></svg>
            <svg class="off"><use href="#i-mute" /></svg>
          </button>
          <label class="readout" for="percent-input">
            <input id="percent-input" type="text" inputmode="numeric" maxlength="3" autocomplete="off" spellcheck="false" data-i18n-aria="volume" />
            <span class="unit">%</span>
          </label>
          <button id="reset" class="ghost-btn" type="button" data-i18n-title="resetTitle">
            <svg><use href="#i-reset" /></svg>
            <span data-i18n="reset"></span>
          </button>
        </div>

        <div class="slider-wrap">
          <input id="slider" type="range" min="0" max="500" step="1" value="100" data-i18n-aria="volume" />
          <div class="ticks" aria-hidden="true">
            <span>0</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span>
          </div>
        </div>

        <div class="presets" role="group" data-i18n-aria="presets">
          <button type="button" data-preset="50">50</button>
          <button type="button" data-preset="100">100</button>
          <button type="button" data-preset="200">200</button>
          <button type="button" data-preset="300">300</button>
          <button type="button" data-preset="400">400</button>
          <button type="button" data-preset="500">500</button>
        </div>

        <div class="effects" role="radiogroup" data-i18n-aria="soundMode">
          <button type="button" class="effect" role="radio" data-effect="default" aria-checked="true" data-i18n-title="defaultTitle">
            <svg><use href="#i-wave" /></svg><span data-i18n="effectDefault"></span>
          </button>
          <button type="button" class="effect" role="radio" data-effect="voice" aria-checked="false" data-i18n-title="voiceTitle">
            <svg><use href="#i-voice" /></svg><span data-i18n="voice"></span>
          </button>
          <button type="button" class="effect" role="radio" data-effect="bass" aria-checked="false" data-i18n-title="bassTitle">
            <svg><use href="#i-bass" /></svg><span data-i18n="bass"></span>
          </button>
        </div>

        <button id="restore" class="restore-btn" type="button" data-i18n-title="restoreTitle" hidden>
          <svg><use href="#i-restore" /></svg>
          <span id="restore-label"></span>
        </button>

        <div id="status" class="status" role="status" hidden>
          <svg><use href="#i-info" /></svg>
          <div>
            <p id="status-text"></p>
            <button id="switch-engine" class="link-btn" type="button" hidden></button>
          </div>
        </div>
      </section>

      <section class="tabs-section">
        <h2 data-i18n="playingTabs"></h2>
        <ul id="tab-list" class="tab-list"></ul>
        <p id="no-tabs" class="empty" data-i18n="noPlaying" hidden></p>
      </section>
    </main>

    <section id="settings-view" class="settings" hidden>
      <div class="settings-head">
        <button id="close-settings" class="icon-btn" type="button" data-i18n-title="back">
          <svg><use href="#i-back" /></svg>
        </button>
        <h2 data-i18n="settings"></h2>
      </div>


      <div class="setting-group" id="engine-group" hidden>
        <h3 data-i18n="engine"></h3>
        <label class="radio-row">
          <input type="radio" name="engine" value="auto" />
          <span><strong data-i18n="engineAuto"></strong><small data-i18n="engineAutoHint"></small></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="engine" value="capture" />
          <span><strong data-i18n="engineCapture"></strong><small data-i18n="engineCaptureHint"></small></span>
        </label>
      </div>

      <div class="setting-group">
        <h3 data-i18n="memory"></h3>
        <label class="switch-row">
          <span data-i18n="rememberSites"></span>
          <input type="checkbox" id="pref-remember" role="switch" />
        </label>
        <label class="switch-row">
          <span data-i18n="autoRestore"></span>
          <input type="checkbox" id="pref-autorestore" role="switch" />
        </label>
        <button id="clear-sites" class="ghost-btn wide" type="button" data-i18n="clearSites"></button>
      </div>

      <div class="setting-group" id="access-group" hidden>
        <h3 data-i18n="permissions"></h3>
        <label class="switch-row">
          <span><span data-i18n="allSites"></span><small data-i18n="allSitesHint"></small></span>
          <input type="checkbox" id="pref-allsites" role="switch" />
        </label>
      </div>

      <div class="setting-group">
        <h3 data-i18n="shortcuts"></h3>
        <p class="hint" data-i18n="shortcutsHint"></p>
        <button id="edit-shortcuts" class="ghost-btn wide" type="button" data-i18n="editShortcuts"></button>
        <p class="hint" id="shortcuts-firefox" data-i18n="shortcutsFirefox" hidden></p>
      </div>

      <div class="setting-group">
        <h3 data-i18n="about"></h3>
        <p class="hint" data-i18n="privacyLong"></p>
        <div class="about-row">
          <span id="version" class="hint"></span>
          <button id="source-link" class="link-btn" type="button">
            <svg><use href="#i-github" /></svg><span data-i18n="sourceCode"></span>
          </button>
        </div>
      </div>
    </section>


    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
