name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Build and package
        run: npm run package
      - name: Lint Firefox build (Mozilla's add-on linter)
        run: npm run lint:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: openvolume-packages
          path: dist/*.zip
